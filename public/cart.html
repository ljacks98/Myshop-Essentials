<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cart</title>
<link rel="stylesheet" href="/styles.css" />
<script src="/shop-config.js"></script>
</head>
<body>
<header class="site-header">
  <a class="cart-link" href="/cart.html" data-cart-link>Cart</a>
  <h1 data-shop-name>Shop</h1>
</header>

<main>
  <a href="/index.html" class="back-link">&larr; Continue shopping</a>
  <h2 style="margin-top:0;">Your Cart</h2>
  <div id="cart-content">
    <p class="loading">Loading cart…</p>
  </div>
</main>

<footer>
<!-- FOOTER:START (auto-generated by scripts/build.js from shop.config.js — do not hand-edit between these markers) -->
  <p>Follow us on Instagram <a href="https://instagram.com/laila7jackson" target="_blank" rel="noopener">@laila7jackson</a></p>
  <p>Questions? Email <a href="mailto:laila747jackson@gmail.com">laila747jackson@gmail.com</a></p>
  <p><a href="https://www.amway.com/myshop/LailaJackson" target="_blank" rel="noopener">Official Amway IBO storefront</a></p>
<!-- FOOTER:END -->
</footer>

<script src="/site.js"></script>
<script>
  let allProducts = [];

  async function renderCart() {
    const container = document.getElementById("cart-content");
    const cart = getCart();

    if (!cart.length) {
      container.innerHTML = `
        <div class="empty-state">
          <p>Your cart is empty.</p>
          <a class="btn" href="/index.html">Browse products</a>
        </div>
      `;
      return;
    }

    if (!allProducts.length) {
      try {
        allProducts = await fetchProducts();
      } catch (e) {
        container.innerHTML = "<p>Could not load your cart right now.</p>";
        return;
      }
    }

    let rowsHtml = "";
    let total = 0;
    let anyMissing = false;

    cart.forEach((line) => {
      const p = allProducts.find((x) => x.id === line.id);
      if (!p || !p.buyable) {
        anyMissing = true;
        return;
      }
      const lineTotal = (p.price || 0) * line.quantity;
      total += lineTotal;
      rowsHtml += `
        <div class="cart-row">
          <div class="thumb">${p.image ? `<img src="${p.image}" alt="${p.title}" />` : ""}</div>
          <div>
            <div class="title" style="font-weight:600;">${p.title}</div>
            <div style="color:var(--text-muted);font-size:0.9rem;">${formatPrice(p)} each</div>
            <button type="button" class="remove-link" data-remove="${p.id}">Remove</button>
          </div>
          <div class="qty-stepper">
            <button type="button" data-minus="${p.id}" aria-label="Decrease quantity">&minus;</button>
            <input type="number" min="1" max="20" value="${line.quantity}" data-qty="${p.id}" />
            <button type="button" data-plus="${p.id}" aria-label="Increase quantity">+</button>
          </div>
          <div style="font-weight:700;white-space:nowrap;">$${lineTotal.toFixed(2)}</div>
        </div>
      `;
    });

    if (!total && !rowsHtml) {
      container.innerHTML = `
        <div class="notice">Everything in your cart is no longer available.</div>
        <div class="empty-state">
          <a class="btn" href="/index.html">Browse products</a>
        </div>
      `;
      return;
    }

    container.innerHTML = `
      ${anyMissing ? '<div class="notice">Some items in your cart are no longer available and were left out of your total.</div>' : ""}
      ${rowsHtml}
      <div class="cart-summary"><span>Total</span><span>$${total.toFixed(2)} USD</span></div>
      <a class="btn" id="checkout-btn" href="#" style="display:block;text-align:center;">Checkout</a>
    `;

    container.querySelectorAll("[data-minus]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const id = btn.getAttribute("data-minus");
        const input = container.querySelector(`[data-qty="${cssEscape(id)}"]`);
        const q = Math.max(0, (parseInt(input.value, 10) || 1) - 1);
        setCartQuantity(id, q);
        renderCart();
      });
    });
    container.querySelectorAll("[data-plus]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const id = btn.getAttribute("data-plus");
        const input = container.querySelector(`[data-qty="${cssEscape(id)}"]`);
        const q = Math.min(20, (parseInt(input.value, 10) || 1) + 1);
        setCartQuantity(id, q);
        renderCart();
      });
    });
    container.querySelectorAll("[data-qty]").forEach((input) => {
      input.addEventListener("change", () => {
        const id = input.getAttribute("data-qty");
        const q = Math.max(0, Math.min(20, parseInt(input.value, 10) || 0));
        setCartQuantity(id, q);
        renderCart();
      });
    });
    container.querySelectorAll("[data-remove]").forEach((btn) => {
      btn.addEventListener("click", () => {
        removeFromCart(btn.getAttribute("data-remove"));
        renderCart();
      });
    });

    const checkoutBtn = document.getElementById("checkout-btn");
    if (checkoutBtn) {
      const productsParam = getCart()
        .filter((line) => allProducts.some((p) => p.id === line.id && p.buyable))
        .map((line) => `${encodeURIComponent(line.id)}:${line.quantity}`)
        .join(",");
      checkoutBtn.href = `/checkout.html?products=${productsParam}`;
    }
  }

  // Minimal CSS.escape polyfill (attribute values here are alphanumeric/dash
  // Amway SKUs, but escape defensively in case of unusual characters).
  function cssEscape(value) {
    return window.CSS && CSS.escape ? CSS.escape(value) : value.replace(/["\\]/g, "\\$&");
  }

  renderCart();
</script>
</body>
</html>
