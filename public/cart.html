<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cart</title>
<link rel="stylesheet" href="/styles.css" />
<script src="/shop-config.js"></script>
</head>
<body>
<header class="site-header">
  <h1 data-shop-name>Shop</h1>
  <p data-shop-tagline></p>
  <a href="/cart.html" class="btn cart-link" data-cart-link>Cart (<span data-cart-count>0</span>)</a>
</header>
<main>
  <a href="/index.html" class="back-link">&larr; Continue shopping</a>
  <div id="cart-content">
    <p class="loading">Loading cart…</p>
  </div>
</main>
<footer>
<!-- FOOTER:START (auto-generated by scripts/build.js from shop.config.js — do not hand-edit between these markers) -->
  <p>Follow us on Instagram <a href="https://instagram.com/laila7jackson" target="_blank" rel="noopener">@laila7jackson</a></p>
  <p>Questions? Email <a href="mailto:laila747jackson@gmail.com">laila747jackson@gmail.com</a></p>
  <p><a href="https://www.amway.com/myshop/LailaJackson" target="_blank" rel="noopener">Official Amway IBO storefront</a></p>
<!-- FOOTER:END -->
</footer>
<script src="/site.js"></script>
<script>
  (async function () {
    const container = document.getElementById("cart-content");
    let products = [];

    function renderRow(item) {
      const p = products.find((x) => x.id === item.id);
      if (!p) return "";
      const lineTotal = (p.price || 0) * item.qty;
      return `
        <div class="cart-row" data-row-id="${p.id}">
          <div class="thumb">
            ${p.image ? `<img src="${p.image}" alt="${p.title}" />` : ""}
          </div>
          <div class="cart-row-body">
            <div class="title">${p.title}</div>
            <div class="price">${formatPrice(p)}</div>
          </div>
          <input
            type="number"
            min="0"
            value="${item.qty}"
            class="qty-input"
            data-qty-id="${p.id}"
            aria-label="Quantity for ${p.title}"
          />
          <div class="line-total">$${lineTotal.toFixed(2)}</div>
          <button class="btn secondary" type="button" data-remove-id="${p.id}">Remove</button>
        </div>
      `;
    }

    function render() {
      const cart = getCart();
      if (cart.length === 0) {
        container.innerHTML = `<p>Your cart is empty. <a href="/index.html">Browse products</a>.</p>`;
        return;
      }
      let subtotal = 0;
      for (const item of cart) {
        const p = products.find((x) => x.id === item.id);
        if (p) subtotal += (p.price || 0) * item.qty;
      }
      container.innerHTML = `
        <div class="cart-list">
          ${cart.map(renderRow).join("")}
        </div>
        <div class="cart-summary">
          <div class="subtotal">Subtotal: $${subtotal.toFixed(2)}</div>
          <a class="btn" href="/checkout.html">Checkout</a>
        </div>
      `;
      renderCartBadge();
    }

    try {
      products = await fetchProducts();
      render();
    } catch (e) {
      container.innerHTML = "<p>Could not load your cart right now.</p>";
      return;
    }

    container.addEventListener("input", (e) => {
      const id = e.target.getAttribute("data-qty-id");
      if (!id) return;
      const qty = Math.max(0, parseInt(e.target.value, 10) || 0);
      updateCartQty(id, qty);
      render();
    });

    container.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-remove-id]");
      if (!btn) return;
      removeFromCart(btn.getAttribute("data-remove-id"));
      render();
    });
  })();
</script>
</body>
</html>
