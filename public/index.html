<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shop</title>
<meta name="description" content="Shop wellness, beauty, and nutrition essentials." />
<link rel="stylesheet" href="/styles.css" />
<script src="/shop-config.js"></script>
</head>
<body>
<header class="site-header">
  <h1 data-shop-name>Shop</h1>
  <p data-shop-tagline></p>
  <a href="/cart.html" class="btn cart-link" data-cart-link>Cart (<span data-cart-count>0</span>)</a>
</header>
<main>
  <div id="grid" class="grid">
    <p class="loading">Loading products…</p>
  </div>
</main>
<footer>
<!-- FOOTER:START (auto-generated by scripts/build.js from shop.config.js — do not hand-edit between these markers) -->
  <p>Follow us on Instagram <a href="https://instagram.com/laila7jackson" target="_blank" rel="noopener">@laila7jackson</a></p>
  <p>Questions? Email <a href="mailto:laila747jackson@gmail.com">laila747jackson@gmail.com</a></p>
  <p><a href="https://www.amway.com/myshop/LailaJackson" target="_blank" rel="noopener">Official Amway IBO storefront</a></p>
<!-- FOOTER:END -->
</footer>
<script src="/site.js"></script>
<script>
  (async function () {
    const grid = document.getElementById("grid");
    try {
      const products = await fetchProducts();
      grid.innerHTML = "";
      products.forEach((p) => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <a class="card-link" href="/product.html?id=${encodeURIComponent(p.id)}">
            <div class="thumb">
              ${p.image ? `<img src="${p.image}" alt="${p.title}" loading="lazy" />` : ""}
            </div>
            <div class="body">
              <div class="brand">${p.brand || ""}</div>
              <div class="title">${p.title}</div>
              <div class="price ${p.price == null ? "unavailable" : ""}">${formatPrice(p)}</div>
            </div>
          </a>
          ${
            p.buyable
              ? `<button class="btn add-btn" type="button" data-add-id="${p.id}">Add to Cart</button>`
              : ""
          }
        `;
        grid.appendChild(card);
      });
      renderCartBadge();
    } catch (e) {
      grid.innerHTML = '<p class="loading">Could not load products right now.</p>';
    }

    // Event delegation: one listener handles every "Add to Cart" button,
    // including ones added after this listener is attached.
    grid.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-add-id]");
      if (!btn) return;
      e.preventDefault();
      addToCart(btn.getAttribute("data-add-id"), 1);
      const original = btn.textContent;
      btn.textContent = "Added!";
      btn.disabled = true;
      setTimeout(() => {
        btn.textContent = original;
        btn.disabled = false;
      }, 900);
    });
  })();
</script>
</body>
</html>
