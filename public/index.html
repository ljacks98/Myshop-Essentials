<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shop</title>
<meta name="description" content="Shop wellness, beauty, and nutrition essentials." />
<link rel="stylesheet" href="/styles.css" />
<script src="/shop-config.js"></script>
</head>
<body>
<header class="site-header">
  <a class="cart-link" href="/cart.html" data-cart-link>Cart</a>
  <h1 data-shop-name>Shop</h1>
  <p data-shop-tagline></p>
</header>

<main>
  <div id="grid" class="grid">
    <p class="loading">Loading products…</p>
  </div>
</main>

<footer>
<!-- FOOTER:START (auto-generated by scripts/build.js from shop.config.js — do not hand-edit between these markers) -->
  <p>Follow us on Instagram <a href="https://instagram.com/laila7jackson" target="_blank" rel="noopener">@laila7jackson</a></p>
  <p>Questions? Email <a href="mailto:laila747jackson@gmail.com">laila747jackson@gmail.com</a></p>
  <p><a href="https://www.amway.com/myshop/LailaJackson" target="_blank" rel="noopener">Official Amway IBO storefront</a></p>
<!-- FOOTER:END -->
</footer>

<script src="/site.js"></script>
<script>
  (async function () {
    const grid = document.getElementById("grid");
    try {
      const products = await fetchProducts();
      grid.innerHTML = "";
      products.forEach((p) => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <a class="card-link" href="/product.html?id=${encodeURIComponent(p.id)}" style="text-decoration:none;color:inherit;">
            <div class="thumb">
              ${p.image ? `<img src="${p.image}" alt="${p.title}" loading="lazy" />` : ""}
            </div>
            <div class="body">
              <div class="brand">${p.brand || ""}</div>
              <div class="title">${p.title}</div>
              <div class="price ${p.price == null ? "unavailable" : ""}">${formatPrice(p)}</div>
            </div>
          </a>
          <div class="card-actions" style="padding: 0 16px 16px;">
            ${
              p.buyable
                ? `<button type="button" class="btn-add-to-cart" data-add-id="${p.id}">Add to Cart</button>`
                : `<span style="color:var(--text-muted);font-size:0.8rem;">Unavailable</span>`
            }
          </div>
        `;
        grid.appendChild(card);
      });

      grid.querySelectorAll("[data-add-id]").forEach((btn) => {
        btn.addEventListener("click", () => {
          addToCart(btn.getAttribute("data-add-id"), 1);
          const original = btn.textContent;
          btn.textContent = "Added ✓";
          setTimeout(() => { btn.textContent = original; }, 1200);
        });
      });
    } catch (e) {
      grid.innerHTML = '<p class="loading">Could not load products right now.</p>';
    }
  })();
</script>
</body>
</html>
