<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Checkout</title>
<link rel="stylesheet" href="/styles.css" />
<script src="/shop-config.js"></script>
<script src="https://js.stripe.com/v3/"></script>
</head>
<body>
<header class="site-header">
  <h1 data-shop-name>Shop</h1>
</header>
<main>
  <a href="/cart.html" id="back-link" class="back-link">&larr; Back to cart</a>
  <div id="summary"></div>
  <div id="checkout-container">
    <p class="loading" id="status">Loading checkout…</p>
    <div id="checkout"></div>
  </div>
</main>
<footer>
<!-- FOOTER:START (auto-generated by scripts/build.js from shop.config.js — do not hand-edit between these markers) -->
  <p>Questions? Email <a href="mailto:laila747jackson@gmail.com">laila747jackson@gmail.com</a></p>
<!-- FOOTER:END -->
</footer>
<script src="/site.js"></script>
<script>
  (async function () {
    const statusEl = document.getElementById("status");
    const cart = getCart();

    if (cart.length === 0) {
      statusEl.textContent = "Your cart is empty.";
      document.getElementById("back-link").href = "/index.html";
      document.getElementById("back-link").textContent = "← Browse products";
      return;
    }
    if (!window.Stripe) {
      statusEl.textContent = "Payment system failed to load. Please refresh the page.";
      return;
    }
    try {
      // 1. Get the publishable key (set via STRIPE_PUBLISHABLE_KEY env var on the server).
      const configRes = await fetch("/api/config");
      const { publishableKey } = await configRes.json();
      if (!publishableKey) {
        statusEl.innerHTML =
          '<div class="notice">Checkout isn\'t configured yet — add STRIPE_PUBLISHABLE_KEY and STRIPE_SECRET_KEY in your Vercel project\'s Environment Variables, then redeploy.</div>';
        return;
      }

      // 2. Show an order summary above the embedded form, for every item in the cart.
      const products = await fetchProducts();
      let subtotal = 0;
      const rows = cart
        .map((item) => {
          const product = products.find((p) => p.id === item.id);
          if (!product) return "";
          const lineTotal = (product.price || 0) * item.qty;
          subtotal += lineTotal;
          return `
            <div class="product-detail" style="grid-template-columns: 70px 1fr auto; gap: 14px; align-items:center; margin-bottom: 14px;">
              <div class="thumb" style="aspect-ratio:1/1;">
                ${product.image ? `<img src="${product.image}" alt="${product.title}" />` : ""}
              </div>
              <div>
                <div class="title" style="font-weight:600;">${product.title}</div>
                <div class="price">${formatPrice(product)} &times; ${item.qty}</div>
              </div>
              <div style="font-weight:600;">$${lineTotal.toFixed(2)}</div>
            </div>
          `;
        })
        .join("");
      document.getElementById("summary").innerHTML = `
        ${rows}
        <div style="text-align:right; font-weight:700; margin: 12px 0 24px; border-top: 1px solid #eee; padding-top: 12px;">
          Subtotal: $${subtotal.toFixed(2)}
        </div>
      `;

      const stripe = Stripe(publishableKey);
      // 3. Mount Stripe's Embedded Checkout, staying on this page. Sends the
      //    WHOLE cart — every product id + quantity — not just one item.
      const checkout = await stripe.initEmbeddedCheckout({
        fetchClientSecret: async () => {
          const res = await fetch("/api/create-checkout-session", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              items: cart.map((item) => ({ productId: item.id, quantity: item.qty })),
            }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || "Could not start checkout");
          return data.clientSecret;
        },
      });
      statusEl.style.display = "none";
      checkout.mount("#checkout");
    } catch (err) {
      statusEl.textContent = err.message || "Something went wrong loading checkout.";
    }
  })();
</script>
</body>
</html>
