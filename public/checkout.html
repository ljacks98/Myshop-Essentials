<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Checkout</title>
<link rel="stylesheet" href="/styles.css" />
<script src="/shop-config.js"></script>
<script src="https://js.stripe.com/v3/"></script>
</head>
<body>
<header class="site-header">
  <h1 data-shop-name>Shop</h1>
</header>

<main>
  <a href="#" id="back-link" class="back-link">&larr; Back to product</a>
  <div id="summary"></div>
  <div id="checkout-container">
    <p class="loading" id="status">Loading checkout…</p>
    <div id="checkout"></div>
  </div>
</main>

<footer>
<!-- FOOTER:START (auto-generated by scripts/build.js from shop.config.js — do not hand-edit between these markers) -->
  <p>Questions? Email <a href="mailto:laila747jackson@gmail.com">laila747jackson@gmail.com</a></p>
<!-- FOOTER:END -->
</footer>

<script src="/site.js"></script>
<script>
  // Parses Meta's multi-item "Website Checkout URL" deep link format:
  //   ?products=CONTENT_ID:QTY,CONTENT_ID:QTY&coupon=CODE
  // CONTENT_ID must match an `id` in public/data/products.json (the same
  // ids used in feed.csv). Falls back to the single-item ?id=X&quantity=N
  // format used by this site's own Buy Now buttons.
  function parseCart() {
    const productsParam = getQueryParam("products");
    if (productsParam) {
      return productsParam
        .split(",")
        .map((pair) => pair.trim())
        .filter(Boolean)
        .map((pair) => {
          const [id, qtyStr] = pair.split(":");
          const quantity = parseInt(qtyStr, 10);
          return { id: (id || "").trim(), quantity: Number.isInteger(quantity) && quantity > 0 ? quantity : 1 };
        })
        .filter((line) => line.id);
    }
    const id = getQueryParam("id");
    if (id) {
      const quantity = parseInt(getQueryParam("quantity"), 10);
      return [{ id, quantity: Number.isInteger(quantity) && quantity > 0 ? quantity : 1 }];
    }
    return [];
  }

  (async function () {
    const requested = parseCart();
    const coupon = getQueryParam("coupon") || "";
    const statusEl = document.getElementById("status");
    const backLink = document.getElementById("back-link");
    if (requested.length === 1) {
      backLink.href = `/product.html?id=${encodeURIComponent(requested[0].id)}`;
    } else {
      backLink.href = "/cart.html";
      backLink.textContent = "← Back to cart";
    }

    if (!requested.length) {
      statusEl.textContent = "No products specified in the checkout link.";
      return;
    }

    if (!window.Stripe) {
      statusEl.textContent = "Payment system failed to load. Please refresh the page.";
      return;
    }

    try {
      // 1. Get the publishable key (set via STRIPE_PUBLISHABLE_KEY env var on the server).
      const configRes = await fetch("/api/config");
      const { publishableKey } = await configRes.json();
      if (!publishableKey) {
        statusEl.innerHTML =
          '<div class="notice">Checkout isn\'t configured yet — add STRIPE_PUBLISHABLE_KEY and STRIPE_SECRET_KEY in your Vercel project\'s Environment Variables, then redeploy.</div>';
        return;
      }

      // 2. Match every requested {id, quantity} against our catalog and
      // render an order summary — this is what a shopper (or Meta's test)
      // checks against the cart they expected before paying.
      const products = await fetchProducts();
      const matched = [];
      const notFound = [];
      requested.forEach((line) => {
        const product = products.find((p) => p.id === line.id);
        if (product) matched.push({ product, quantity: line.quantity });
        else notFound.push(line.id);
      });

      let summaryHtml = "";
      if (notFound.length) {
        summaryHtml += `<div class="notice">These item ids from the link weren't found in the catalog and can't be included: ${notFound
          .map((id) => `<code>${id}</code>`)
          .join(", ")}</div>`;
      }

      let grandTotal = 0;
      matched.forEach(({ product, quantity }) => {
        if (product.price != null) grandTotal += product.price * quantity;
        summaryHtml += `
          <div class="product-detail" style="grid-template-columns: 72px 1fr auto; gap: 16px; align-items:center; margin-bottom: 14px;">
            <div class="thumb" style="aspect-ratio:1/1;">
              ${product.image ? `<img src="${product.image}" alt="${product.title}" />` : ""}
            </div>
            <div>
              <div class="title" style="font-weight:600;">${product.title}</div>
              <div style="color:var(--text-muted);font-size:0.9rem;">Qty ${quantity}</div>
            </div>
            <div class="price" style="font-size:1rem;white-space:nowrap;">${formatPrice(product)}</div>
          </div>
        `;
      });
      if (matched.length > 1) {
        summaryHtml += `<div style="text-align:right;font-weight:700;margin:12px 0 24px;">Total: $${grandTotal.toFixed(2)} USD</div>`;
      }
      if (coupon) {
        summaryHtml += `<div style="color:var(--text-muted);font-size:0.9rem;margin-bottom:16px;">Promo code from link: <code>${coupon}</code> — enter it in the payment form below to apply it.</div>`;
      }
      document.getElementById("summary").innerHTML = summaryHtml;

      if (!matched.length) {
        statusEl.textContent = "None of the requested products could be found — nothing to check out.";
        return;
      }

      const stripe = Stripe(publishableKey);

      // 3. Mount Stripe's Embedded Checkout, staying on this page.
      const checkout = await stripe.initEmbeddedCheckout({
        fetchClientSecret: async () => {
          const res = await fetch("/api/create-checkout-session", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              cart: matched.map(({ product, quantity }) => ({ id: product.id, quantity })),
              coupon,
            }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || "Could not start checkout");
          return data.clientSecret;
        },
      });

      statusEl.style.display = "none";
      checkout.mount("#checkout");
    } catch (err) {
      statusEl.textContent = err.message || "Something went wrong loading checkout.";
    }
  })();
</script>
</body>
</html>
