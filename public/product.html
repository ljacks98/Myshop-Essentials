<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Product</title>
<link rel="stylesheet" href="/styles.css" />
<script src="/shop-config.js"></script>
</head>
<body>
<header class="site-header">
  <a class="cart-link" href="/cart.html" data-cart-link>Cart</a>
  <h1 data-shop-name>Shop</h1>
  <p data-shop-tagline></p>
</header>

<main>
  <a href="/index.html" class="back-link">&larr; Back to all products</a>
  <div id="content">
    <p class="loading">Loading…</p>
  </div>
</main>

<footer>
<!-- FOOTER:START (auto-generated by scripts/build.js from shop.config.js — do not hand-edit between these markers) -->
  <p>Follow us on Instagram <a href="https://instagram.com/laila7jackson" target="_blank" rel="noopener">@laila7jackson</a></p>
  <p>Questions? Email <a href="mailto:laila747jackson@gmail.com">laila747jackson@gmail.com</a></p>
  <p><a href="https://www.amway.com/myshop/LailaJackson" target="_blank" rel="noopener">Official Amway IBO storefront</a></p>
<!-- FOOTER:END -->
</footer>

<script src="/site.js"></script>
<script>
  (async function () {
    const content = document.getElementById("content");
    const id = getQueryParam("id");
    if (!id) {
      content.innerHTML = "<p>No product specified.</p>";
      return;
    }
    try {
      const products = await fetchProducts();
      const p = products.find((x) => x.id === id);
      if (!p) {
        content.innerHTML = "<p>Product not found.</p>";
        return;
      }
      document.title = `${p.title} — ${(window.SHOP_CONFIG || {}).SHOP_NAME || "Shop"}`;

      const buyable = p.buyable && p.price != null;

      content.innerHTML = `
        <div class="product-detail">
          <div class="thumb">
            ${p.image ? `<img src="${p.image}" alt="${p.title}" />` : ""}
          </div>
          <div>
            <div class="brand">${p.brand || ""}</div>
            <h2>${p.title}</h2>
            <div class="price">${formatPrice(p)}</div>
            <p class="desc">${p.description || ""}</p>
            ${
              buyable
                ? `
                  <div class="qty-stepper" id="qty-stepper">
                    <button type="button" id="qty-minus" aria-label="Decrease quantity">&minus;</button>
                    <input type="number" id="qty-input" value="1" min="1" max="20" />
                    <button type="button" id="qty-plus" aria-label="Increase quantity">+</button>
                  </div>
                  <div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;">
                    <button type="button" class="btn secondary" id="add-to-cart-btn">Add to Cart</button>
                    <a class="btn" id="buy-now-link" href="/checkout.html?products=${encodeURIComponent(p.id)}:1">Buy Now</a>
                  </div>
                  <p id="add-feedback" style="color:var(--accent);font-size:0.85rem;margin-top:10px;min-height:1.2em;"></p>
                `
                : `<button class="btn disabled" disabled>Currently unavailable</button>
                   <p style="color:var(--text-muted);font-size:0.85rem;margin-top:10px;">This item isn't ready for checkout yet — message us on Instagram if you'd like it.</p>`
            }
          </div>
        </div>
      `;

      if (buyable) {
        const qtyInput = document.getElementById("qty-input");
        const buyNowLink = document.getElementById("buy-now-link");
        const feedback = document.getElementById("add-feedback");

        function currentQty() {
          const n = parseInt(qtyInput.value, 10);
          return Number.isInteger(n) && n > 0 ? n : 1;
        }
        function syncBuyNowLink() {
          buyNowLink.href = `/checkout.html?products=${encodeURIComponent(p.id)}:${currentQty()}`;
        }
        document.getElementById("qty-minus").addEventListener("click", () => {
          qtyInput.value = Math.max(1, currentQty() - 1);
          syncBuyNowLink();
        });
        document.getElementById("qty-plus").addEventListener("click", () => {
          qtyInput.value = Math.min(20, currentQty() + 1);
          syncBuyNowLink();
        });
        qtyInput.addEventListener("change", () => {
          qtyInput.value = Math.min(20, currentQty());
          syncBuyNowLink();
        });
        document.getElementById("add-to-cart-btn").addEventListener("click", () => {
          addToCart(p.id, currentQty());
          feedback.textContent = `Added ${currentQty()} to cart.`;
          setTimeout(() => { feedback.textContent = ""; }, 2000);
        });
      }
    } catch (e) {
      content.innerHTML = "<p>Could not load this product right now.</p>";
    }
  })();
</script>
</body>
</html>
