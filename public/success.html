<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Order confirmed</title>
<link rel="stylesheet" href="/styles.css" />
<script src="/shop-config.js"></script>
</head>
<body>
<header class="site-header">
  <h1 data-shop-name>Shop</h1>
</header>

<main>
  <div id="content" style="text-align:center; padding: 40px 0;">
    <p class="loading">Confirming your order…</p>
  </div>
  <div style="text-align:center; margin-top: 24px;">
    <a class="btn secondary" href="/index.html">Continue shopping</a>
  </div>
</main>

<footer>
<!-- FOOTER:START (auto-generated by scripts/build.js from shop.config.js — do not hand-edit between these markers) -->
  <p>Questions? Email <a href="mailto:laila747jackson@gmail.com">laila747jackson@gmail.com</a></p>
<!-- FOOTER:END -->
</footer>

<script src="/site.js"></script>
<script>
  (async function () {
    const sessionId = getQueryParam("session_id");
    const content = document.getElementById("content");
    if (!sessionId) {
      content.innerHTML = "<p>No order to confirm.</p>";
      return;
    }
    try {
      const res = await fetch(`/api/session-status?session_id=${encodeURIComponent(sessionId)}`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Could not confirm order");

      if (data.paymentStatus === "paid") {
        clearCart(); // empty the on-site cart now that payment is confirmed
        content.innerHTML = `
          <h2>Thank you! 🎉</h2>
          <p>Your order is confirmed${data.customerEmail ? ` — a receipt was sent to ${data.customerEmail}` : ""}.</p>
        `;
      } else {
        content.innerHTML = `<p>Payment status: ${data.paymentStatus || "pending"}.</p>`;
      }
    } catch (err) {
      content.innerHTML = `<p>${err.message}</p>`;
    }
  })();
</script>
</body>
</html>
